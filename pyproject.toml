[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-cal-node"
version = "0.1.0"
description = "Post-implementation calibration node for the Forge Ecosystem"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.10.3",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]
# Optional: enables the consumer-side ForgeLineage Gate 3 transport checks
# (src/eval_cal_node/lineage/). The forge_lineage_sdk / forge_contract_core
# packages are Forge-monorepo-only and are resolved at runtime, not via pip.
lineage = [
    "httpx>=0.27",
]

[project.scripts]
eval-cal-node = "eval_cal_node.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eval_cal_node = ["schemas/*.json", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
